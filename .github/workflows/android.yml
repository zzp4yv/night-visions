name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-30" "build-tools;30.0.3"

      - name: Switch to Java 11 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 7.0.2

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Package and sign APK
        run: |
          mkdir -p app/build/outputs/apk/release
          cp app/prebuilt/night-vision-9.22.5.3-unsigned.apk app/build/outputs/apk/release/night-vision-9.22.5.3-unsigned.apk
          zip -d app/build/outputs/apk/release/night-vision-9.22.5.3-unsigned.apk 'META-INF/*.RSA' 'META-INF/*.SF' 'META-INF/MANIFEST.MF' 'META-INF/INDEX.LIST' || true
          "$ANDROID_HOME/build-tools/30.0.3/zipalign" -p -f 4 app/build/outputs/apk/release/night-vision-9.22.5.3-unsigned.apk app/build/outputs/apk/release/night-vision-9.22.5.3-aligned.apk
          "$ANDROID_HOME/build-tools/30.0.3/apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-pass pass:android --out app/build/outputs/apk/release/night-vision-9.22.5.3.apk app/build/outputs/apk/release/night-vision-9.22.5.3-aligned.apk
          "$ANDROID_HOME/build-tools/30.0.3/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/night-vision-9.22.5.3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: night-vision-9.22.5.3
          path: app/build/outputs/apk/release/night-vision-9.22.5.3.apk
          if-no-files-found: error
